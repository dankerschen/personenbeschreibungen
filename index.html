  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.03); }

      const s=this.add.sprite(x,y,"c_"+n.id).setOrigin(.5,1).setScale(sc/K).setDepth(y);
      this.add.image(x,y-1,"sh").setScale(sc/K).setDepth(y-1); this.tweens.add({targets:s,scaleY:sc/K*1.04,duration:650+Math.random()*300,yoyo:true,repeat:-1});
      this.add.text(x,y-26*sc-2,n.name,{fontFamily:"monospace",fontSize:"8px",color:"#fff",stroke:"#000",strokeThickness:2}).setOrigin(.5,1).setResolution(3).setDepth(9999);
      solid.add(n.tx+","+n.ty);
      const o={kind:"npc",n,x,y:y-6,s,label:"💬 Sprechen"}; this.ints.push(o); return o;});
    this.psh=this.add.image(0,0,"sh"); this.pl=this.add.sprite(4*T+8,15*T+10,"h_d0").setOrigin(.5,1);
    this.cameras.main.setRoundPixels(true).setZoom(2); this.setRegion(0);
    for(let i=0;i<20;i++){const fx=(i<14?37+Math.random()*10:39+Math.random()*5)*T, fy=(i<14?18+Math.random()*9:3+Math.random()*5)*T;   // fireflies
      const f=this.add.image(fx,fy,"ff").setBlendMode(Phaser.BlendModes.ADD).setDepth(9000);
      this.tweens.add({targets:f,x:fx+Phaser.Math.Between(-28,28),y:fy+Phaser.Math.Between(-18,18),alpha:{from:.15,to:1},duration:1400+Math.random()*1800,yoyo:true,repeat:-1,ease:"Sine.easeInOut"});}
    for(let i=0;i<3;i++){const c=this.add.image(-100,40+i*170,"cl").setDepth(8000);this.tweens.add({targets:c,x:W*T+100,duration:70000+i*15000,repeat:-1,delay:i*9000});} // clouds        // soft vignette
    
    this.initAnimals();
    this.refreshGates(); hud(); if(!S.hero)openCreator();
    this.input.on("pointerdown",p=>{ if(modal)return; const wx=p.worldX, wy=p.worldY, tx=wx/T|0, ty=wy/T|0;
      const hit=this.ints.find(o=>Math.abs(wx-o.x)<11&&wy>o.y-26&&wy<o.y+8);
      if(hit&&hit.kind==="npc"&&finding){ if(hit.n.id===finding.target){const f=finding;finding=null;$("find").hidden=true;fb("",1);complete(f);}
        else toast("Noch nicht. Schau dir die Personen genau an."); return;}
      if(!finding){const c=(this.crit||[]).find(c=>critHit(c,wx,wy)); if(c){tapAnimal(c.k);return;}}
      if(hit){ if(Math.hypot(this.pl.x-hit.x,this.pl.y-hit.y)<30) interact(hit); else this.walkNear(tx,ty); return;}
      if(grid[ty]&&grid[ty][tx]===9){say("",LOCKED_MSG);return;}
      if(!solidTile(tx,ty)) this.walkTo(tx,ty); });
  }
  refreshGates(){ gates.forEach(g=>[14,15].forEach(y=>{const open=doneCount()>=g.need; grid[y][g.x]=open?1:9; this.tiles[y][g.x].setTexture(open?(y===14?"t1t":"t1b"):"t9");})); }
  setRegion(i,fade){const r=this.REG[i],c=this.cameras.main;c.stopFollow();c.setBounds(r[0],r[1],r[2],r[3]);c.centerOn(this.pl.x,this.pl.y);c.startFollow(this.pl,true,.12,.12);if(fade){c.fadeIn(300);toast(r[4]);}}
  jumpFish(list){   // a small fish sometimes jumps out of a nearby water tile
    const pl=this.pl, near=list.filter(w=>deepWater(w)&&Math.abs(w.x-pl.x)<170&&Math.abs(w.y-pl.y)<100); if(!near.length||modal)return;
    const w=near[Math.random()*near.length|0], dir=Math.random()<.5?-1:1, f=this.add.image(w.x,w.y,"fish").setDepth(9).setFlipX(dir<0);
    const ring=(x,y)=>{const r=this.add.image(x,y,"ring").setDepth(8);this.tweens.add({targets:r,scale:{from:.15,to:.7},alpha:{from:.9,to:0},duration:500,onComplete:()=>r.destroy()});};
    ring(w.x,w.y); sfx("plop",Math.max(.3,1-Math.hypot(w.x-pl.x,w.y-pl.y)/200)); this.crit=this.crit||[]; this.crit.push({s:f,k:"fish"});
    this.tweens.add({targets:f,x:w.x+dir*8,angle:{from:-35*dir,to:35*dir},duration:600});
    this.tweens.add({targets:f,y:w.y-9,duration:300,yoyo:true,ease:"Quad.easeOut",onComplete:()=>{ring(f.x,f.y);this.crit=this.crit.filter(c=>c.s!==f);f.destroy();}});
  }
  ripple(list){   // shallow/narrow water: ripples and a dim fish shadow, always inside its own tile
    const pl=this.pl, near=list.filter(w=>!deepWater(w)&&Math.abs(w.x-pl.x)<170&&Math.abs(w.y-pl.y)<100); if(!near.length||modal)return;
    const w=near[Math.random()*near.length|0];
    sfx("plop",Math.max(.25,1-Math.hypot(w.x-pl.x,w.y-pl.y)/200)*.6);
    const ring=(d)=>this.time.delayedCall(d,()=>{const r=this.add.image(w.x,w.y,"ring").setDepth(8);this.tweens.add({targets:r,scale:{from:.12,to:.45},alpha:{from:.8,to:0},duration:700,onComplete:()=>r.destroy()});});
    ring(0); ring(250);
    if(Math.random()<.5){const f=this.add.image(w.x-3,w.y,"fish").setDepth(9).setTint(0x2a5a8a).setAlpha(0).setFlipX(Math.random()<.5);
      this.tweens.add({targets:f,x:w.x+3,alpha:.45,duration:700,yoyo:true,onComplete:()=>f.destroy()});}
  }
  initAnimals(){
    const rnd=(a,b)=>a+Math.random()*(b-a);
    this.walkers=[]; this.crit=[];
    const addWalker=(key,box,spd,n)=>{for(let i=0;i<n;i++){const w={box,spd,wait:Math.random()*2,x:0,y:0,tx:0,ty:0}; if(!this.pickSpot(w,true))continue;
      w.s=this.add.sprite(w.x,w.y,key).setOrigin(.5,1).setDepth(w.y); this.walkers.push(w); this.crit.push({s:w.s,k:key});}};
    addWalker("cat",[3*T,17*T,16*T,27*T],16,1);                  // village meadow
    addWalker("hen",[22*T,19*T,29*T,24*T],10,3);                 // yard behind the house
    addWalker("rabbit",[37*T,19*T,46*T,27*T],22,2);              // forest
    // ducks swim in the middle of the two big ponds (box stays inside the 2x2 deep centre)
    [[118,138,86,106],[886,906,358,378],[118,138,86,106]].forEach(([x0,x1,y0,y1],i)=>{
      const d=this.add.image(rnd(x0,x1),rnd(y0,y1),"duck").setDepth(10); this.crit.push({s:d,k:"duck"});
      const swim=()=>{const nx=rnd(x0,x1), ny=rnd(y0,y1); d.setFlipX(nx<d.x);
        this.tweens.add({targets:d,x:nx,y:ny,duration:rnd(2500,5000),ease:"Sine.easeInOut",onComplete:()=>this.time.delayedCall(rnd(300,1800),swim)});};
      this.time.delayedCall(i*700,swim);});
    // butterflies over the village meadow
    for(let i=0;i<7;i++){const b=this.add.image(rnd(3*T,33*T),rnd(17*T,27*T),["bfa","bfb","bfc"][i%3]).setDepth(7000); this.crit.push({s:b,k:"butterfly"});
      this.tweens.add({targets:b,scaleY:{from:1/K,to:.35/K},duration:140,yoyo:true,repeat:-1});
      const fly=()=>{const nx=Phaser.Math.Clamp(b.x+rnd(-45,45),2*T,34*T), ny=Phaser.Math.Clamp(b.y+rnd(-30,30),16*T,28*T);
        this.tweens.add({targets:b,x:nx,y:ny,duration:rnd(1500,3200),ease:"Sine.easeInOut",onComplete:fly});};
      this.time.delayedCall(i*300,fly);}
    // a bird flies over the village every now and then
    this.time.addEvent({delay:14000,loop:true,callback:()=>{ if(modal||this.pl.y>=30*T)return;
      const dir=Math.random()<.5?1:-1, y=this.pl.y-rnd(50,95), x0=this.pl.x-dir*220, b=this.add.image(x0,y,"bird0").setDepth(8200).setFlipX(dir<0);
      this.crit.push({s:b,k:"bird"}); sfx("chirp",.6); this.time.delayedCall(1800,()=>sfx("chirp",.5)); this.time.delayedCall(3600,()=>sfx("chirp",.4));
      this.tweens.add({targets:b,x:x0+dir*440,y:y-rnd(-15,15),duration:7000,onUpdate:()=>b.setTexture((this.time.now/140|0)%2?"bird1":"bird0"),onComplete:()=>{this.crit=this.crit.filter(c=>c.s!==b);b.destroy();}});}});
  }
  pickSpot(w,init){   // random free spot inside the animal's box
    for(let i=0;i<40;i++){const x=w.box[0]+Math.random()*(w.box[2]-w.box[0]), y=w.box[1]+Math.random()*(w.box[3]-w.box[1]);
      if(free(x,y)){ if(init){w.x=x;w.y=y;} w.tx=x;w.ty=y; return true; }}
    return false;
  }
  animalsTick(dt){
    for(const w of this.walkers){
      if(w.wait>0){w.wait-=dt;continue;}
      const dx=w.tx-w.x, dy=w.ty-w.y, d=Math.hypot(dx,dy);
      if(d<2){w.wait=1+Math.random()*3;this.pickSpot(w);continue;}
      const m=Math.min(d,w.spd*dt), nx=w.x+dx/d*m, ny=w.y+dy/d*m;
      if(free(nx,ny)){w.x=nx;w.y=ny;} else {w.wait=.4;this.pickSpot(w);}
      if(Math.abs(dx)>1)w.s.setFlipX(dx<0);
      w.s.setPosition(w.x,w.y).setDepth(w.y);
    }
  }
  walkTo(tx,ty){const p=bfs(this.pl.x/T|0,(this.pl.y-2)/T|0,tx,ty); if(p){path=p;const m=this.add.image(tx*T+8,ty*T+8,"ring").setDepth(8500);this.tweens.add({targets:m,scale:{from:.2,to:.9},alpha:{from:1,to:0},duration:450,onComplete:()=>m.destroy()});}}
  walkNear(tx,ty){for(const [dx,dy] of [[0,1],[1,0],[-1,0],[0,-1]]){const p=bfs(this.pl.x/T|0,(this.pl.y-2)/T|0,tx+dx,ty+dy); if(p){path=p;return;}}}
  step(dx,dy){let m=false; if(dx&&free(this.pl.x+dx,this.pl.y)){this.pl.x+=dx;m=true;} if(dy&&free(this.pl.x,this.pl.y+dy)){this.pl.y+=dy;m=true;} if(Math.abs(dx)>Math.abs(dy)){this.dir="l";this.pl.flipX=dx>0;}else if(dy){this.dir=dy<0?"u":"d";this.pl.flipX=false;} return m;}
  update(t,dt){
    dt/=1000; let mv=false; if(this.walkers)this.animalsTick(Math.min(dt,.1));
    if(modal){path=[];}
    else{
      if(path.length){const p=path[0],ex=p.x-this.pl.x,ey=p.y-this.pl.y,d=Math.hypot(ex,ey);
        if(d<2)path.shift(); else{const m=Math.min(d,SPD*dt); mv=this.step(ex/d*m,ey/d*m); if(!mv)path=[];}}
    }
    if(mv){this.stepT=(this.stepT||0)-dt;if(this.stepT<=0){this.stepT=.3;sfx("step");}}else this.stepT=0;
    this.pl.setTexture("h_"+(this.dir||"d")+(mv?[0,1,0,2][(t/130|0)%4]:0)).setDepth(this.pl.y); this.psh.setPosition(this.pl.x,this.pl.y-1).setDepth(this.pl.y-1);
    const P=this.P[(this.pl.x/T|0)+","+((this.pl.y-2)/T|0)];
    if(P&&!modal){path=[];this.pl.setPosition(P[0]*T+8,P[1]*T+10);this.setRegion(P[2],true);}   // walk through a door -> new map
    let best=null,bd=28; if(!modal)this.ints.forEach(o=>{ if(o.kind==="npc"&&finding)return; const d=Math.hypot(this.pl.x-o.x,this.pl.y-o.y); if(d<bd){bd=d;best=o;}});
    if(best!==cur){cur=best;$("act").hidden=!cur;if(cur)$("act").textContent=cur.label;}
  }
}
new Phaser.Game({type:Phaser.AUTO,parent:"game",width:640,height:360,pixelArt:true,backgroundColor:"#1b1530",
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},input:{keyboard:false},scene:Main});
</script></body></html>
